<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Absensi Karyawan</title>

    <meta name="theme-color" content="#3B82F6" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: #fff;
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #video, #photo-preview {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-red-100 to-blue-200 min-h-screen flex items-center justify-center p-4">

    <div id="attendance-card" class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-8 space-y-6">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-800">Form Presensi Karyawan</h1>
            <p class="text-gray-500 mt-2">Silakan isi data dan ambil foto selfie.</p>
        </div>

        <form id="attendance-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal & Waktu</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="ph ph-calendar text-gray-400"></i></div>
                    <input type="text" id="datetime" name="timestamp" readonly class="w-full pl-10 pr-4 py-3 bg-gray-100 border border-gray-300 rounded-lg text-gray-600 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Karyawan <span class="text-red-500">*</span></label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="ph ph-user text-gray-400"></i></div>
                    <select id="employee-name" name="nama_karyawan" required class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 appearance-none">
                        <option value="" disabled selected>Pilih nama Anda</option>
                        <option value="Rindu">Rindu</option><option value="Desti">Desti</option><option value="Nenden">Nenden</option>
                        <option value="Eko">Eko</option><option value="Bunga">Bunga</option><option value="Azriel">Azriel</option>
                        <option value="Algi">Algi</option><option value="Reri">Reri</option><option value="Lela">Lela</option>
                        <option value="Alvin">Alvin</option><option value="Taufik">Taufik</option><option value="Salwa">Salwa</option>
                        <option value="Marwan">Marwan</option><option value="Ihsan">Ihsan</option><option value="Rizki">Rizki</option>
                        <option value="Raditia">Raditia</option><option value="Burhan">Burhan</option><option value="Tedi">Tedi</option>
                        <option value="Yayang">Yayang</option><option value="Ardi">Ardi</option><option value="Hasna">Hasna</option>
                        <option value="Dinda">Dinda</option><option value="Deri">Deri</option><option value="Dodi">Dodi</option>
                        <option value="Rizal">Rizal</option><option value="Encep">Encep</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Stand / Bagian <span class="text-red-500">*</span></label>
                <select name="bagian" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="" disabled selected>Pilih bagian kerja</option>
                    <option value="Kasir">Kasir</option>
                    <option value="Customer Service">Customer Service</option>
                    <option value="Stelling">Stelling</option>
                    <option value="Tongseng/Bakaran">Tongseng/Bakaran</option>
                    <option value="Gorengan">Gorengan</option>
                    <option value="Minuman">Minuman</option>
                    <option value="Blonk">Blonk</option>
                    <option value="Cleaning Dapur/CP">Cleaning Dapur/CP</option>
                    <option value="Sambal">Sambal</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Shift Kerja <span class="text-red-500">*</span></label>
                <select name="shift" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="" disabled selected>Pilih shift</option>
                    <option value="Shift Pagi">Shift Pagi</option>
                    <option value="Shift Siang">Shift Siang</option>
                    <option value="Shift Malam">Shift Malam</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Keterangan <span class="text-red-500">*</span></label>
                <select name="keterangan" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="H">Hadir</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-700">Foto Selfie <span class="text-red-500">*</span></label>
                <div class="relative bg-gray-50 rounded-xl overflow-hidden border-2 border-dashed border-gray-300 flex flex-col items-center justify-center p-2 min-h-[200px]">
                    <video id="video" class="hidden" autoplay playsinline></video>
                    <canvas id="canvas" class="hidden"></canvas>
                    <img id="photo-preview" class="hidden" alt="Preview Selfie">
                    
                    <div id="camera-placeholder" class="py-8 flex flex-col items-center">
                        <i class="ph ph-camera text-5xl text-gray-300"></i>
                        <p class="text-sm text-gray-400 mt-2">Kamera belum aktif</p>
                    </div>
                </div>
                <button type="button" id="capture-btn" class="w-full py-3 bg-gray-800 text-white rounded-lg flex items-center justify-center gap-2 hover:bg-black transition-colors">
                    <i class="ph ph-aperture"></i> <span>Buka Kamera</span>
                </button>
            </div>

            <input type="hidden" id="latitude" name="latitude">
            <input type="hidden" id="longitude" name="longitude">

            <div id="error-message" class="hidden text-sm text-center text-red-600 bg-red-50 p-3 rounded-lg border border-red-200"></div>

            <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <button type="button" id="reset-button" class="w-full px-6 py-3 border border-gray-300 text-gray-600 font-semibold rounded-lg hover:bg-gray-50">Reset</button>
                <button type="submit" id="submit-button" class="w-full px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 shadow-lg flex items-center justify-center gap-2 disabled:bg-blue-300">
                    <span id="submit-text">Kirim Absen</span>
                    <div id="submit-spinner" class="spinner hidden"></div>
                </button>
            </div>
        </form>
    </div>

    <div id="success-card" class="hidden w-full max-w-lg bg-white rounded-2xl shadow-xl p-10 text-center">
        <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="ph ph-check-circle text-5xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800">Absensi Berhasil!</h2>
        <p class="text-gray-600 mt-2 mb-8">Terima kasih, <span id="success-name" class="font-bold text-blue-600"></span>. Data dan foto Anda telah tersimpan.</p>
        <button id="back-button" class="w-full py-3 bg-gray-100 text-gray-700 rounded-lg font-medium hover:bg-gray-200">Kembali ke Form</button>
    </div>

    <script>
        // GANTI INI DENGAN URL WEB APP ANDA
                const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMEmykWQdLjTOEvqwRpbNcoK9fXHrE6reNIBMrP27JajZ7A_X9Yj3mAsO0Fm5EiCBW/exec";

        const attendanceForm = document.getElementById('attendance-form');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const photoPreview = document.getElementById('photo-preview');
        const cameraPlaceholder = document.getElementById('camera-placeholder');
        const submitButton = document.getElementById('submit-button');
        const submitSpinner = document.getElementById('submit-spinner');
        const submitText = document.getElementById('submit-text');
        
        let imageData = null;

        function setCurrentDateTime() {
            const now = new Date();
            const wib = new Date(now.getTime() + (7 * 60 * 60 * 1000));
            document.getElementById('datetime').value = wib.toISOString().replace('T', ' ').substring(0, 19);
        }

        // FUNGSI KOMPRESI FOTO
        async function compressImage(base64Str, maxWidth = 800, maxHeight = 800) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvasComp = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    // Resize proporsional jika terlalu besar
                    if (width > height) {
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                    }

                    canvasComp.width = width;
                    canvasComp.height = height;
                    const ctx = canvasComp.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Loop untuk mendapatkan ukuran di bawah 300KB
                    let quality = 0.9; // Mulai dari kualitas 90%
                    let resultBase64 = canvasComp.toDataURL('image/jpeg', quality);
                    
                    // Hitung estimasi ukuran (Base64 is ~33% larger than binary)
                    while ((resultBase64.length * 0.75) > 300000 && quality > 0.1) {
                        quality -= 0.1;
                        resultBase64 = canvasComp.toDataURL('image/jpeg', quality);
                    }
                    
                    console.log("Ukuran akhir: " + Math.round(resultBase64.length * 0.75 / 1024) + " KB");
                    resolve(resultBase64);
                };
            });
        }

        captureBtn.addEventListener('click', async () => {
            if (video.classList.contains('hidden') && photoPreview.classList.contains('hidden')) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    video.srcObject = stream;
                    video.classList.remove('hidden');
                    cameraPlaceholder.classList.add('hidden');
                    captureBtn.querySelector('span').innerText = "Ambil Foto";
                } catch (err) {
                    alert("Izin kamera ditolak atau tidak didukung.");
                }
            } else if (!video.classList.contains('hidden')) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                // Ambil raw image
                const rawData = canvas.toDataURL('image/jpeg');
                
                // Jalankan kompresi otomatis
                imageData = await compressImage(rawData);
                
                photoPreview.src = imageData;
                photoPreview.classList.remove('hidden');
                video.classList.add('hidden');
                
                const tracks = video.srcObject.getTracks();
                tracks.forEach(t => t.stop());
                captureBtn.querySelector('span').innerText = "Foto Ulang";
            } else {
                photoPreview.classList.add('hidden');
                imageData = null;
                captureBtn.click();
            }
        });

        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) return resolve();
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        document.getElementById('latitude').value = pos.coords.latitude.toFixed(6);
                        document.getElementById('longitude').value = pos.coords.longitude.toFixed(6);
                        resolve();
                    },
                    () => resolve(),
                    { timeout: 5000 }
                );
            });
        }

        attendanceForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!imageData) return alert("Harap ambil foto selfie!");

            submitButton.disabled = true;
            submitText.classList.add('hidden');
            submitSpinner.classList.remove('hidden');

            try {
                await getLocation();
                const formData = new FormData(attendanceForm);
                const dataObj = {};
                formData.forEach((val, key) => dataObj[key] = val);
                dataObj.image = imageData; 

                // Menggunakan fetch standar (mode cors) jika AppScript sudah benar
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(dataObj)
                });

                document.getElementById('success-name').textContent = dataObj.nama_karyawan;
                document.getElementById('attendance-card').classList.add('hidden');
                document.getElementById('success-card').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                alert("Absen terkirim (cek spreadsheet).");
                // Refresh jika terjadi error CORS tapi data masuk
                location.reload();
            } finally {
                submitButton.disabled = false;
                submitText.classList.remove('hidden');
                submitSpinner.classList.add('hidden');
            }
        });

        document.getElementById('reset-button').addEventListener('click', () => {
            attendanceForm.reset();
            setCurrentDateTime();
            photoPreview.classList.add('hidden');
            cameraPlaceholder.classList.remove('hidden');
            imageData = null;
        });

        document.getElementById('back-button').addEventListener('click', () => location.reload());

        window.onload = setCurrentDateTime;

    </script>
</body>
</html>
